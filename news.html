<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News — AlphaLab @ USTC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .news-thumb {
      flex-shrink: 0;
      width: 96px; height: 72px;
      border-radius: 10px;
      overflow: hidden;
      background: #ede9fe;
      border: 1px solid #ddd6fe;
      cursor: zoom-in;
      transition: border-color 0.18s;
    }
    .news-thumb:hover { border-color: #a78bfa; }
    .news-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    /* floating preview — appended to body by JS */
    #news-thumb-preview {
      position: fixed;
      z-index: 99999;
      pointer-events: none;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(109,40,217,0.35);
      border: 2px solid #a78bfa;
      width: 320px;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #news-thumb-preview.show {
      opacity: 1;
      transform: scale(1);
    }
    #news-thumb-preview img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

<nav id="navbar">
  <a href="index.html" class="nav-brand"><div class="dot"></div>AlphaLab @ USTC</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="publications.html">Papers</a></li>
    <li><a href="news.html" class="active">News</a></li>
    <li><a href="people.html">Team</a></li>
    <li><a href="gallery.html">Gallery</a></li>
  </ul>
</nav>

<section class="page-hero">
  <div class="page-hero-glow"></div>
  <div class="page-hero-inner">
    <a href="index.html" class="page-hero-breadcrumb">← Home</a>
    <h1 class="page-hero-title">News &amp; Updates</h1>
    <p class="page-hero-sub">Latest happenings from AlphaLab</p>
  </div>
</section>

<div class="wave-wrap">
  <svg viewBox="0 0 1440 72" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="width:100%;height:72px;">
    <path d="M0,36 C200,72 400,0 600,30 C800,60 1000,10 1200,36 C1320,54 1380,18 1440,36 L1440,72 L0,72 Z" fill="#f8f7ff"/>
  </svg>
</div>

<div class="content">
<div class="container">
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">News &amp; Updates</h2>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-year="all">All</button>
      <button class="filter-btn" data-year="2026">2026</button>
      <button class="filter-btn" data-year="2025">2025</button>
      <button class="filter-btn" data-year="2024">2024</button>
      <button class="filter-btn" data-year="2023">2023</button>
    </div>

    <ul id="news-list" class="news-list">
      <li style="text-align:center;padding:2rem;color:#94a3b8;list-style:none">Loading…</li>
    </ul>
    <p id="news-empty" style="display:none;text-align:center;padding:2rem;color:#94a3b8;">No items for this period.</p>
  </section>
</div>
</div>

<footer>
  <p>© 2025 AlphaLab @ USTC · School of AI and Data Science</p>
  <p style="margin-top:4px;">
    <a href="https://anzhang314.github.io" target="_blank">PI Homepage</a> ·
    <a href="https://github.com/AlphaLab-USTC" target="_blank">GitHub</a> ·
    <a href="mailto:anzhang314@ustc.edu.cn">Contact</a>
  </p>
</footer>

<script>
const ro = new IntersectionObserver(
  es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); ro.unobserve(e.target); } }),
  { threshold: 0.08 }
);
function initReveal() { document.querySelectorAll('.reveal:not(.visible)').forEach(el => ro.observe(el)); }

function newsItemHtml(n) {
  const papers = (n.papers || []).length
    ? `<div class="news-papers">${n.papers.map(p => `<a href="${p.url}" target="_blank">${p.title}</a>`).join('')}</div>`
    : '';
  const thumb = n.image
    ? `<div class="news-thumb"><img src="${n.image}" alt="" loading="lazy" /></div>`
    : '';
  return `
    <li class="news-item reveal" data-year="${n.year}">
      <span class="news-date">${n.date}</span>
      ${thumb}
      <div class="news-body">
        <div class="news-title">${n.title}</div>
        ${n.desc ? `<div class="news-desc">${n.desc}</div>` : ''}
        ${papers}
      </div>
    </li>`;
}

let allNews = [];

function render(items) {
  const list  = document.getElementById('news-list');
  const empty = document.getElementById('news-empty');
  if (items.length) {
    list.innerHTML = items.map(newsItemHtml).join('');
    empty.style.display = 'none';
    initReveal();
  } else {
    list.innerHTML = '';
    empty.style.display = 'block';
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const y = btn.dataset.year;
    render(y === 'all' ? allNews : allNews.filter(n => String(n.year) === y));
  });
});

fetch('data/news.json')
  .then(r => r.json())
  .then(data => { allNews = data; render(data); })
  .catch(() => {
    document.getElementById('news-list').innerHTML =
      '<li style="text-align:center;padding:2rem;color:#ef4444;list-style:none">Failed to load.</li>';
  });

// ── thumbnail hover preview (fixed overlay on body)
const preview = document.createElement('div');
preview.id = 'news-thumb-preview';
preview.innerHTML = '<img src="" alt="" />';
document.body.appendChild(preview);
const previewImg = preview.querySelector('img');

const PREVIEW_W = 320;
preview.style.width = PREVIEW_W + 'px';

let hideTimer;

function positionPreview(rect) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const h = preview.offsetHeight;
  let left = rect.right + 12;
  let top  = rect.top + rect.height / 2 - h / 2;
  if (left + PREVIEW_W > vw - 12) left = rect.left - PREVIEW_W - 12;
  if (top < 12) top = 12;
  if (top + h > vh - 12) top = vh - h - 12;
  preview.style.left = left + 'px';
  preview.style.top  = top  + 'px';
}

document.getElementById('news-list').addEventListener('mouseover', e => {
  const thumb = e.target.closest('.news-thumb');
  if (!thumb) return;
  clearTimeout(hideTimer);
  const src = thumb.querySelector('img')?.src;
  if (!src) return;

  const rect = thumb.getBoundingClientRect();
  if (previewImg.src !== src) {
    previewImg.src = src;
    previewImg.onload = () => { positionPreview(rect); preview.classList.add('show'); };
  } else {
    positionPreview(rect);
    preview.classList.add('show');
  }
});

document.getElementById('news-list').addEventListener('mouseout', e => {
  const thumb = e.target.closest('.news-thumb');
  if (!thumb) return;
  hideTimer = setTimeout(() => preview.classList.remove('show'), 80);
});
</script>
</body>
</html>
