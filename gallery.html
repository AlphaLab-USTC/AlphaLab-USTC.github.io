<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — AlphaLab @ USTC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .gallery-item { position: relative; overflow: hidden; border-radius: 12px; aspect-ratio: 4/3; cursor: pointer; background: #e9e3f8; }
    .gallery-item img { width:100%; height:100%; object-fit:cover; transition: transform 0.35s ease; display:block; }
    .gallery-item:hover img { transform: scale(1.06); }
    .gallery-caption { position:absolute; bottom:0; left:0; right:0; padding:24px 12px 8px; background:linear-gradient(transparent,rgba(10,5,26,.75)); color:#fff; font-size:.72rem; font-weight:500; opacity:0; transition:opacity .25s; }
    .gallery-item:hover .gallery-caption { opacity:1; }
    /* lightbox */
    .lightbox { display:none; position:fixed; inset:0; z-index:1000; background:rgba(5,2,15,.92); backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:2rem; }
    .lightbox.open { display:flex; }
    #lb-img { max-width:min(90vw,960px); max-height:80vh; border-radius:12px; object-fit:contain; box-shadow:0 24px 60px rgba(0,0,0,.5); }
    #lb-caption { position:absolute; bottom:2rem; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.7); font-size:.85rem; background:rgba(255,255,255,.07); border-radius:20px; padding:5px 16px; white-space:nowrap; }
    #lb-close { position:absolute; top:1.2rem; right:1.5rem; color:rgba(255,255,255,.65); background:rgba(255,255,255,.08); border:none; border-radius:50%; width:36px; height:36px; font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .18s; }
    #lb-close:hover { color:#fff; background:rgba(124,58,237,.5); }
    .lb-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.1); border:none; color:#fff; font-size:1.4rem; width:44px; height:44px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .18s; backdrop-filter:blur(8px); }
    .lb-nav:hover { background:rgba(124,58,237,.5); }
    #lb-prev { left:1.2rem; }
    #lb-next { right:1.2rem; }
    @media (max-width:700px) { .gallery-grid { grid-template-columns:repeat(2,1fr); } .lb-nav { display:none; } }
    @media (max-width:420px) { .gallery-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>

<nav id="navbar">
  <a href="index.html" class="nav-brand"><div class="dot"></div>AlphaLab @ USTC</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="publications.html">Papers</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="people.html">Team</a></li>
    <li><a href="gallery.html" class="active">Gallery</a></li>
  </ul>
</nav>

<section class="page-hero">
  <div class="page-hero-glow"></div>
  <div class="page-hero-inner">
    <a href="index.html" class="page-hero-breadcrumb">← Home</a>
    <h1 class="page-hero-title">Gallery</h1>
    <p class="page-hero-sub">Lab life, conferences &amp; adventures</p>
  </div>
</section>

<div class="wave-wrap">
  <svg viewBox="0 0 1440 72" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="width:100%;height:72px;">
    <path d="M0,36 C200,72 400,0 600,30 C800,60 1000,10 1200,36 C1320,54 1380,18 1440,36 L1440,72 L0,72 Z" fill="#f8f7ff"/>
  </svg>
</div>

<div class="content">
<div class="container">
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Gallery</h2>
      <p id="photo-count" class="section-desc">Loading…</p>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-cat="all">All</button>
      <button class="filter-btn" data-cat="lab-life">Lab Life</button>
      <button class="filter-btn" data-cat="conferences">Conferences</button>
      <button class="filter-btn" data-cat="trips">Trips &amp; Outings</button>
    </div>

    <div id="gallery-grid" class="gallery-grid"></div>
  </section>
</div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button id="lb-close">✕</button>
  <button class="lb-nav" id="lb-prev">&#8249;</button>
  <img id="lb-img" src="" alt="" />
  <button class="lb-nav" id="lb-next">&#8250;</button>
  <div id="lb-caption"></div>
</div>

<footer>
  <p>© 2025 AlphaLab @ USTC · School of AI and Data Science</p>
  <p style="margin-top:4px;">
    <a href="https://anzhang314.github.io" target="_blank">PI Homepage</a> ·
    <a href="https://github.com/AlphaLab-USTC" target="_blank">GitHub</a> ·
    <a href="mailto:anzhang314@ustc.edu.cn">Contact</a>
  </p>
</footer>

<script>
// ── scroll reveal
const ro = new IntersectionObserver(
  es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); ro.unobserve(e.target); } }),
  { threshold: 0.05 }
);
function initReveal() { document.querySelectorAll('.reveal:not(.visible)').forEach(el => ro.observe(el)); }

// ── gallery
let allPhotos = [];
let visiblePhotos = [];
let currentIdx = 0;

function galleryItemHtml(p, idx) {
  return `
    <div class="gallery-item" data-cat="${p.category}" data-idx="${idx}">
      <img src="images/gallery/${p.file}" alt="${p.caption}" loading="lazy" />
      <div class="gallery-caption">${p.caption}</div>
    </div>`;
}

function render(photos) {
  visiblePhotos = photos;
  document.getElementById('gallery-grid').innerHTML = photos.map((p, i) => galleryItemHtml(p, i)).join('');
  document.getElementById('photo-count').textContent = `${photos.length} photo${photos.length !== 1 ? 's' : ''}`;
  document.querySelectorAll('.gallery-item').forEach((el, i) => {
    el.addEventListener('click', () => openLightbox(i));
  });
}

// ── filter
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.cat;
    render(cat === 'all' ? allPhotos : allPhotos.filter(p => p.category === cat));
  });
});

// ── lightbox
function openLightbox(idx) {
  currentIdx = idx;
  const p = visiblePhotos[idx];
  document.getElementById('lb-img').src       = 'images/gallery/' + p.file;
  document.getElementById('lb-caption').textContent = p.caption;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function prevPhoto()     { openLightbox((currentIdx - 1 + visiblePhotos.length) % visiblePhotos.length); }
function nextPhoto()     { openLightbox((currentIdx + 1) % visiblePhotos.length); }

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); prevPhoto(); });
document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); nextPhoto(); });
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowLeft')   prevPhoto();
  if (e.key === 'ArrowRight')  nextPhoto();
});

// ── fetch
fetch('data/gallery.json')
  .then(r => r.json())
  .then(data => { allPhotos = data; render(data); })
  .catch(() => {
    document.getElementById('gallery-grid').innerHTML =
      '<p style="text-align:center;padding:2rem;color:#ef4444">Failed to load.</p>';
  });
</script>
</body>
</html>
