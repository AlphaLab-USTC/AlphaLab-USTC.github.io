  <script>
    // 放大数量固定为1
    (() => {
      const grid = document.querySelector('.gallery-grid');
      if (!grid) return;
    
      const items = Array.from(grid.querySelectorAll('.gallery-item'));
      const candidates = items.filter((_, idx) => ((idx + 1) % 4) !== 0);

      const EXPANDED_COUNT = 1;   // 每轮只放大1个
      const CYCLE_MS     = 6000; // 放慢节奏：轮换间隔（毫秒）
    
      let timer = null;
    
      function clearExpanded() {
        candidates.forEach(el => el.classList.remove('expanded'));
      }
    
      function sampleOne(arr) {
        if (arr.length === 0) return [];
        const idx = Math.floor(Math.random() * arr.length);
        return [arr[idx]];
      }
    
      function tick() {
        clearExpanded();
        // 过滤掉第 4、8、12... 个（1-based 可被 4 整除）
        const chosen = sampleOne(candidates);
        // 同帧批量应用，减少回流
        requestAnimationFrame(() => chosen.forEach(el => el.classList.add('expanded')));
      }
    
      function start() { stop(); tick(); timer = setInterval(tick, CYCLE_MS); }
      function stop()  { if (timer) clearInterval(timer), timer = null; }
    
      // 页签隐藏时暂停，返回时恢复
      document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
      // 窗口尺寸变化时重启一轮（适配列数变化）
      window.addEventListener('resize', () => { stop(); start(); });
    
      start();
    })();
  </script>


  <script>
    document.getElementById('language-toggle').addEventListener('click', function() {
      const currentLang = this.getAttribute('data-default-lang');
      const newLang = currentLang === 'zh' ? 'en' : 'zh'; // 切换语言
      this.setAttribute('data-default-lang', newLang);
      loadLanguage(newLang);
    });

    function loadLanguage(lang) {
      const language = lang === 'en' ? 'en' : 'zh';
      fetch(`/static/js/lang/${language}.json`)
        .then(response => response.json())
        .then(data => {
          document.querySelectorAll('[i18n]').forEach(element => {
            const key = element.getAttribute('i18n');
            if (data[key]) {
              element.textContent = data[key];
            }
          });
        })
        .catch(error => console.error('Error loading language file:', error));
    }

    // Load default language on page load
    document.addEventListener('DOMContentLoaded', function() {
      const defaultLang = document.getElementById('language-toggle').getAttribute('data-default-lang');
      loadLanguage(defaultLang);
    });
  </script>
