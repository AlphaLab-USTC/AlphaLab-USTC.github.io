<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications — AlphaLab @ USTC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav id="navbar">
  <a href="index.html" class="nav-brand"><div class="dot"></div>AlphaLab @ USTC</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="publications.html" class="active">Papers</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="people.html">Team</a></li>
    <li><a href="gallery.html">Gallery</a></li>
  </ul>
</nav>

<section class="page-hero">
  <div class="page-hero-glow"></div>
  <div class="page-hero-inner">
    <a href="index.html" class="page-hero-breadcrumb">← Home</a>
    <h1 class="page-hero-title">Publications</h1>
    <p class="page-hero-sub" id="hero-sub">NeurIPS · ICLR · KDD · SIGIR · WWW</p>
  </div>
</section>

<div class="wave-wrap">
  <svg viewBox="0 0 1440 72" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="width:100%;height:72px;">
    <path d="M0,36 C200,72 400,0 600,30 C800,60 1000,10 1200,36 C1320,54 1380,18 1440,36 L1440,72 L0,72 Z" fill="#f8f7ff"/>
  </svg>
</div>

<div class="content">
<div class="container">
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">All Publications</h2>
      <p id="pub-count" class="section-desc">Loading…</p>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-venue="all">All</button>
      <button class="filter-btn" data-venue="neurips">NeurIPS</button>
      <button class="filter-btn" data-venue="icml">ICML</button>
      <button class="filter-btn" data-venue="iclr">ICLR</button>
      <button class="filter-btn" data-venue="kdd">KDD</button>
      <button class="filter-btn" data-venue="sigir">SIGIR</button>
      <button class="filter-btn" data-venue="www">WWW</button>
    </div>

    <div id="pub-container"></div>
  </section>
</div>
</div>

<footer>
  <p>© 2025 AlphaLab @ USTC · School of AI and Data Science</p>
  <p style="margin-top:4px;">
    <a href="https://anzhang314.github.io" target="_blank">PI Homepage</a> ·
    <a href="https://github.com/AlphaLab-USTC" target="_blank">GitHub</a> ·
    <a href="mailto:anzhang314@ustc.edu.cn">Contact</a>
  </p>
</footer>

<script>
const ro = new IntersectionObserver(
  es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); ro.unobserve(e.target); } }),
  { threshold: 0.08 }
);
function initReveal() { document.querySelectorAll('.reveal:not(.visible)').forEach(el => ro.observe(el)); }

const VENUE_BADGE = { NeurIPS:'badge-neurips', ICLR:'badge-iclr', ICML:'badge-icml', KDD:'badge-kdd', SIGIR:'badge-sigir', WWW:'badge-www', ACL:'badge-acl', CVPR:'badge-cvpr' };

function pubCardHtml(p) {
  const badgeCls  = VENUE_BADGE[p.venue] || 'badge-neurips';
  const vLabel    = p.venue + ' ' + p.year + (p.note ? ' ' + p.note : '');
  const imgStyle  = p.gradient ? ` style="background:${p.gradient}"` : '';
  const imgHtml   = p.image
    ? `<img src="${p.image}" alt="${p.title}" />`
    : `<div class="pub-img-placeholder">${p.placeholder}</div>`;
  const authors   = p.authors.map(a => a.me ? `<span class="me">${a.name}</span>` : a.name).join(', ');
  const links     = p.links.map(l => `<a href="${l.url}" target="_blank" class="pub-link"><i class="${l.icon}"></i> ${l.label}</a>`).join('');
  return `
    <div class="pub-card reveal" data-venue="${p.venue.toLowerCase()}">
      <div class="pub-img"${imgStyle}>${imgHtml}<span class="pub-venue-badge ${badgeCls}">${vLabel}</span></div>
      <div class="pub-body">
        <div class="pub-title"><a href="${p.links[0]?.url || '#'}" target="_blank">${p.title}</a></div>
        <div class="pub-authors">${authors}</div>
        <div class="pub-links">${links}</div>
      </div>
    </div>`;
}

let allPubs = [];

const VENUE_ORDER = ['NeurIPS', 'ICML', 'ICLR', 'KDD', 'SIGIR', 'WWW', 'ACL', 'CVPR'];

function groupedHtml(items) {
  const groups = {};
  items.forEach(p => {
    const key = `${p.venue} ${p.year}`;
    (groups[key] = groups[key] || []).push(p);
  });
  const sorted = Object.entries(groups).sort(([a], [b]) => {
    const [av, ay] = a.split(' '), [bv, by] = b.split(' ');
    if (ay !== by) return Number(by) - Number(ay);
    const ai = VENUE_ORDER.indexOf(av), bi = VENUE_ORDER.indexOf(bv);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });
  return sorted.map(([key, papers]) => `
    <div class="pub-group reveal">
      <div class="pub-group-header">
        <span class="pub-group-title">${key}</span>
        <span class="pub-group-count">${papers.length} paper${papers.length > 1 ? 's' : ''}</span>
      </div>
      <div class="pub-grid">${papers.map(pubCardHtml).join('')}</div>
    </div>`
  ).join('');
}

function render(items, grouped) {
  document.getElementById('pub-container').innerHTML = grouped
    ? groupedHtml(items)
    : `<div class="pub-grid reveal">${items.map(pubCardHtml).join('')}</div>`;
  document.getElementById('pub-count').textContent =
    `${items.length} publication${items.length !== 1 ? 's' : ''}`;
  initReveal();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const v = btn.dataset.venue;
    const isAll = v === 'all';
    render(isAll ? allPubs : allPubs.filter(p => p.venue.toLowerCase() === v), isAll);
  });
});

fetch('data/publications.json')
  .then(r => r.json())
  .then(data => {
    allPubs = data;
    document.getElementById('hero-sub').textContent =
      `${data.length} publications · NeurIPS · ICLR · KDD · SIGIR · WWW`;
    render(data, true);
  })
  .catch(() => {
    document.getElementById('pub-container').innerHTML =
      '<p style="text-align:center;padding:2rem;color:#ef4444">Failed to load.</p>';
  });
</script>
</body>
</html>
