  <script>
    document.getElementById('language-toggle').addEventListener('click', function() {
      const currentLang = this.getAttribute('data-default-lang');
      const newLang = currentLang === 'zh' ? 'en' : 'zh'; // 切换语言
      this.setAttribute('data-default-lang', newLang);
      loadLanguage(newLang);
    });

    function loadLanguage(lang) {
      const language = lang === 'en' ? 'en' : 'zh';
      fetch(`/static/js/lang/${language}.json`)
        .then(response => response.json())
        .then(data => {
          document.querySelectorAll('[i18n]').forEach(element => {
            const key = element.getAttribute('i18n');
            if (data[key]) {
              element.textContent = data[key];
            }
          });
        })
        .catch(error => console.error('Error loading language file:', error));
    }

    // Load default language on page load
    document.addEventListener('DOMContentLoaded', function() {
      const defaultLang = document.getElementById('language-toggle').getAttribute('data-default-lang');
      loadLanguage(defaultLang);
    });
  </script>
